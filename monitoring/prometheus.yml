global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: webapp
    static_configs:
      - targets: [app:8000]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
